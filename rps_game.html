<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="rps_game.css">
    <script defer src="rps_game.js"></script>
</head>
<body>
    <div id="container">
        <div id="computer-healthbar" class="healthbar"></div>

        <div id="playing-screen">
            <div id="choices">
                <div id="rock-area">✊</div>
                <div id="paper-area">✋</div>
                <div id="scissors-area">✌️</div>
            </div>

            <div id="player"><img src="player.png" width="20px" height="50px"></div>
            
        </div>

        <div id="shooting-screen">
            <div id="computer-choice"></div>
            <div id="player-choice"></div>

            <div id="gameover"></div>
        </div>

        <div id="player-healthbar" class="healthbar"></div>
    </div>

    <div class="footer">
        Copyright &nbsp;© &nbsp;MetallicCrimson 2026
    </div>
</body>
</html>
